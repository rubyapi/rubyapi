services:
  search:
    image: opensearchproject/opensearch:3.5.0
    init: true
    ports:
      - "127.0.0.1:9600:9600"
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=RubyApi-Local-OpenSearch-2026!
    volumes:
      - search-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--insecure",
          "--user",
          "admin:RubyApi-Local-OpenSearch-2026!",
          "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s",
        ]
      retries: 3
      interval: 5s
      timeout: 60s
      start_period: 60s

  search-console:
    image: opensearchproject/opensearch-dashboards:3.5.0
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["https://search:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: RubyApi-Local-OpenSearch-2026!
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--user",
          "admin:RubyApi-Local-OpenSearch-2026!",
          "http://localhost:5601/api/status",
        ]
      interval: 5s
      timeout: 3s
    depends_on:
      search:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: rubyapi
      POSTGRES_PASSWORD: rubyapi_password
      POSTGRES_DB: rubyapi_development
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubyapi -d rubyapi_development"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  search-data: {}
  postgres-data: {}
